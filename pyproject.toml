[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigillum"
version = "0.2.0"
description = "Verify and open Italian/eIDAS .p7m signed files (CAdES)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vasilis Narain", email = "vasilis.narain@hotmail.it" }]
keywords = ["eidas", "cades", "p7m", "digital-signature", "italy", "cli", "cms"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]
dependencies = [
    "asn1crypto>=1.5",
    "cryptography>=41",
    "pyHanko>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

# Fill these in once the GitHub repo exists:
[project.urls]
Homepage = "https://github.com/Vasilis-Narain/sigillum"
Issues   = "https://github.com/Vasilis-Narain/sigillum/issues"

[project.scripts]
sigillum = "sigillum.cli:main"

[tool.setuptools.packages.find]
include = ["sigillum*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"sigillum/cli.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
